name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    name: Driver (vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: driver/go.mod
          cache-dependency-path: driver/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -o docker-machine-driver-fusioncompute .

  ui:
    name: UI (build extension)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --network-timeout 600000

      - name: Build extension bundle
        run: bash ./scripts/build-extension.sh

      - name: Show bundle layout
        run: find dist-pkg/extensions -type f | sort
