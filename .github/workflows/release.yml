name: Release

# Tag a commit with `vX.Y.Z` (matching the UI version) to build and publish:
#   * the docker-machine driver binary for each OS/arch (release assets)
#   * the Rancher UI extension bundle as a tarball (release asset)
#   * `checksums.txt`
#   * the UI extension directory tree to GitHub Pages, so the UIPlugin CR can
#     fetch `<endpoint>/files.txt` directly from the repo's Pages site.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  driver:
    name: Driver ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: driver/go.mod
          cache-dependency-path: driver/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          out="docker-machine-driver-fusioncompute_${GOOS}_${GOARCH}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${out}" .
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: driver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: driver/dist/docker-machine-driver-fusioncompute_*
          if-no-files-found: error

  ui:
    name: UI extension bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --network-timeout 600000

      - name: Build extension bundle
        run: bash ./scripts/build-extension.sh

      - name: Stage bundle
        id: stage
        run: |
          set -euo pipefail
          version="$(node -p "require('./pkg/fusioncompute/package.json').version")"
          mkdir -p stage/extensions
          cp -r "dist-pkg/extensions/fusioncompute" "stage/extensions/fusioncompute"
          # Top-level dir inside the tarball is `extensions/`, so untarring at
          # the Pages site root yields extensions/fusioncompute/<version>/...
          tar -C stage -czf "fusioncompute-ui-${version}.tar.gz" extensions
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          find stage -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: ui-bundle
          path: ui/fusioncompute-ui-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [ driver, ui ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \
            \( -name 'docker-machine-driver-fusioncompute_*' -o -name 'fusioncompute-ui-*.tar.gz' \) \
            -exec cp {} release/ \;
          ( cd release && sha256sum * > checksums.txt )
          echo "=== release assets ==="
          ls -la release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

  pages:
    name: Publish UI to GitHub Pages
    needs: [ ui ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-bundle
          path: ui-bundle

      - name: Unpack bundle into site
        run: |
          set -euo pipefail
          mkdir -p _site
          tar -C _site -xzf ui-bundle/fusioncompute-ui-*.tar.gz
          echo "=== site ==="
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
