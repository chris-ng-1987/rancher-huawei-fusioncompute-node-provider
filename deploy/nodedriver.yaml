# NodeDriver — registers the FusionCompute docker-machine driver with Rancher.
#
# Apply against the local cluster that hosts Rancher:
#   kubectl --context=<rancher-local> apply -f deploy/nodedriver.yaml
#
# Field names are the docker-machine flags with the `fusioncompute-` prefix
# stripped and camelCased (e.g. `fusioncompute-dcs-hostname` -> `dcsHostname`).
apiVersion: management.cattle.io/v3
kind: NodeDriver
metadata:
  name: fusioncompute
  annotations:
    # Lets Rancher auto-create the instrumented dynamic-schema (the form
    # rendered on the "Cloud Credential" page) for a third-party driver.
    # Without it the credential page is just key/value for every field.
    lifecycle.cattle.io/create.node-driver-controller: "true"
    # Credential visibility / UI hints. Read by Rancher when rendering the
    # generic credential and machine-config forms.
    publicCredentialFields: dcsHostname,dcsPort,dcsUsername,dcsSiteUri
    privateCredentialFields: dcsPassword
    optionalCredentialFields: dcsPort,dcsSiteUri
    passwordFields: dcsPassword,sshPassword,sshPrivateKey
    defaults: dcsPort:7443,cpu:2,memoryMb:4096,diskGb:250,sshUser:root
spec:
  displayName: FusionCompute
  active: true
  builtin: false
  addCloudCredential: true
  # EDIT THIS: point at the driver binary. Tagged releases publish one asset
  # per OS/arch; pick the one matching the host that runs Rancher (normally
  # linux/amd64), e.g.
  #   https://github.com/chris-ng-1987/rancher-huawei-fusioncompute-node-provider/releases/download/v0.2.0-beta.2/docker-machine-driver-fusioncompute_linux_amd64
  url: https://github.com/chris-ng-1987/rancher-huawei-fusioncompute-node-provider/releases/download/v0.2.0-beta.2/docker-machine-driver-fusioncompute_linux_amd64
  # sha256 of the binary above, taken from the release's `checksums.txt`.
  # The value below matches the v0.2.0-beta.2 linux/amd64 asset; update it if
  # you change `url`.
  checksum: 6955b02459e73bf527f8f6561e43ac9e4e7f0a82d7b4ee8bfa8ec4eca172746d
  #
  # whitelistDomains — optional host allow-list consulted by older Rancher
  # releases. Rancher 2.15+ uses `ProxyEndpoint` CRs for the live dropdowns
  # instead (see deploy/proxyendpoint.yaml); keep entries here too if you must
  # support both. A bare IP cannot be allow-listed by a ProxyEndpoint.
  #
  # >>> add your FusionCompute VRM host(s)/IP(s) here, e.g.:
  #   - vrm.example.com
  #   - 192.0.2.50
  whitelistDomains: []
