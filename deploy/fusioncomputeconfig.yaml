# Example RKE machine config for the FusionCompute node driver.
#
# This is a ready-to-edit template; in normal use Rancher generates this CR
# from the machine-pool form. Field names are the docker-machine flags with
# the `fusioncompute-` prefix stripped and camelCased, and the numeric fields
# are strings (Rancher's generated rke-machine-config CRD types them that way).
#
# Replace every example value with one from your own FusionCompute farm. The
# Template / Datastore / Cluster / Port Group values can be read from the
# corresponding URNs the UI dropdowns populate (or from the FC API).
apiVersion: rke-machine-config.cattle.io/v1
kind: FusioncomputeConfig
metadata:
  name: fusioncompute-example
  namespace: default
cpu: "4"
memoryMb: "8192"
diskGb: "250"
osVersion: Linux

# --- VRM connection (usually supplied via a Cloud Credential instead) ---
dcsHostname: vrm.example.com
dcsPort: "7443"
dcsUsername: admin
dcsPassword: ""
# Required: the FusionCompute site URI, e.g. /service/sites/1.
dcsSiteUri: "/service/sites/1"
# Certificate verification is on by default. Set true only for self-signed
# VRM certificates; this is also exposed as a checkbox on the Cloud Credential form.
skipTlsVerify: false

# --- Placement ---
# templateId is the bare VM id of the template to clone, e.g. i-00000001.
templateId: i-00000001
# Full URNs, as returned by the FusionCompute API.
datastoreUrn: urn:sites:1:datastores:1
location: urn:sites:1:clusters:1
portGroupUrn: urn:sites:1:dvswitchs:1:portgroups:1

# --- Networking: the guest NIC always uses DHCP, so each node in a pool
# gets its own address.

# --- Access ---
# Choose ONE authentication mode:
#
# 1. Key-only: paste an unencrypted private key. The driver writes it to the
#    machine store and uses it for the initial login; the template must
#    already trust the matching public key for sshUser. No password is sent
#    to FusionCompute. sshPrivateKey is mutually exclusive with sshPassword,
#    setVmPassword, generatePassword, and sshKeyPath.
sshPrivateKey: ""
#
# 2. Username/password (the default): with setVmPassword=false the SSH user
#    and the template's existing password are used once to install the
#    driver's generated key; leave sshPassword blank if the template already
#    trusts the key. With setVmPassword=true FusionCompute resets root's
#    password on first boot and the driver uses it once to install the key.
setVmPassword: false
sshUser: root
sshPassword: ""
# Standalone docker-machine only: path to a pre-provisioned private key on
# the host running the driver. The template must trust the matching public
# key. Mutually exclusive with sshPrivateKey.
sshKeyPath: ""

# Description shown on the cloned VM. Empty falls back to the driver default.
vmDescription: "Provisioned by docker-machine-driver-fusioncompute"

# Optional first-boot script. It runs over SSH at the end of Create(), after
# the driver installs its key and before Rancher's RKE2/K3s node init script.
# It runs once per VM creation and does not replace the Rancher init script.
# Do not put secrets in this field.
customScript: ""
